<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tennisytics Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-wrap { max-width: 960px; margin: 0 auto; padding: 2rem; }
    .login-card { background: var(--white); border-radius: 12px; padding: 2.5rem; max-width: 400px; margin: 6rem auto; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .login-card h1 { color: var(--primary); margin-bottom: 1.5rem; font-size: 1.5rem; }
    .admin-input { width: 100%; padding: 0.75rem 1rem; border: 1.5px solid var(--mid); border-radius: 8px; font-size: 1rem; margin-bottom: 1rem; box-sizing: border-box; background: #f9f9f9; color: var(--text); }
    .admin-btn { width: 100%; padding: 0.85rem; background: var(--primary); color: var(--white); border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
    .admin-btn:hover { opacity: 0.85; }
    .admin-btn.secondary { background: transparent; color: var(--primary); border: 2px solid var(--primary); margin-top: 0.5rem; }
    .error-msg { color: #c0392b; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
    /* Dashboard */
    #dashboard { display: none; }
    .topbar { background: var(--primary); color: var(--white); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .topbar h2 { font-size: 1.2rem; margin: 0; }
    .topbar button { background: rgba(255,255,255,0.2); color: var(--white); border: 1px solid rgba(255,255,255,0.4); padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    .topbar button:hover { background: rgba(255,255,255,0.3); }
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
    .stat-card { background: var(--white); border-radius: 10px; padding: 1.25rem 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .stat-card .stat-num { font-size: 2rem; font-weight: 800; color: var(--primary); }
    .stat-card .stat-label { font-size: 0.85rem; color: #666; margin-top: 0.25rem; }
    .section-title { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin: 2rem 0 1rem; border-bottom: 2px solid var(--mid); padding-bottom: 0.5rem; }
    .msg-card { background: var(--white); border-radius: 10px; padding: 1.25rem; margin-bottom: 0.75rem; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .msg-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem; }
    .msg-name { font-weight: 700; color: var(--primary); }
    .msg-date { font-size: 0.8rem; color: #888; }
    .msg-subject { font-size: 0.9rem; font-weight: 600; color: #444; margin-bottom: 0.4rem; }
    .msg-body { font-size: 0.9rem; color: var(--text); line-height: 1.6; white-space: pre-wrap; }
    .reply-btn { margin-top: 0.75rem; display: inline-block; background: var(--primary); color: var(--white); padding: 0.4rem 1rem; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    .reply-btn:hover { opacity: 0.85; }
    .empty-state { text-align: center; color: #888; padding: 2rem; }
    .loading { text-align: center; color: #888; padding: 1rem; }
    .tab-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .tab-btn { padding: 0.5rem 1.25rem; border-radius: 20px; border: 2px solid var(--primary); background: transparent; color: var(--primary); font-weight: 700; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
    .tab-btn.active { background: var(--primary); color: var(--white); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .unread-badge { background: #e74c3c; color: white; border-radius: 10px; font-size: 0.75rem; padding: 0.1rem 0.5rem; margin-left: 0.4rem; }
  </style>
</head>
<body>

<!-- Login -->
<div id="loginSection">
  <div class="login-card">
    <h1>🎾 Tennisytics Admin</h1>
    <p id="loginError" class="error-msg"></p>
    <input id="emailInput" class="admin-input" type="email" placeholder="E-posta" autocomplete="email" />
    <input id="passInput" class="admin-input" type="password" placeholder="Şifre" autocomplete="current-password" />
    <button class="admin-btn" onclick="doLogin()">Giriş Yap</button>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="topbar">
    <h2>🎾 Tennisytics Admin</h2>
    <button onclick="doLogout()">Çıkış</button>
  </div>
  <div class="admin-wrap">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="statMessages">—</div>
        <div class="stat-label">Toplam Mesaj</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statUnread">—</div>
        <div class="stat-label">Yanıtsız Mesaj</div>
      </div>
    </div>

    <div class="tab-row">
      <button class="tab-btn active" onclick="showTab('messages', this)">Mesajlar</button>
    </div>

    <div id="tab-messages" class="tab-content active">
      <div class="section-title">İletişim Mesajları</div>
      <div id="messagesList"><div class="loading">Yükleniyor…</div></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
  import { getFirestore, collection, getDocs, orderBy, query }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const ALLOWED_EMAIL = 'bhdrklkn09@gmail.com';

  const app = initializeApp({
    apiKey: 'AIzaSyBzHWdU3cj1oP1kG7ncR1ZbF3-xVJtL5u4',
    authDomain: 'tennisytics.firebaseapp.com',
    projectId: 'tennisytics',
    storageBucket: 'tennisytics.firebasestorage.app',
    messagingSenderId: '312570455629',
    appId: '1:312570455629:web:e4ff6ea7ca09dcafdf1e04',
  });

  const auth = getAuth(app);
  const db = getFirestore(app);

  window.doLogin = async () => {
    const email = document.getElementById('emailInput').value.trim();
    const pass = document.getElementById('passInput').value;
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    try {
      const cred = await signInWithEmailAndPassword(auth, email, pass);
      if (cred.user.email !== ALLOWED_EMAIL) {
        await signOut(auth);
        errEl.textContent = 'Bu hesabın admin yetkisi yok.';
        errEl.style.display = 'block';
      }
    } catch (e) {
      errEl.textContent = 'Giriş başarısız. E-posta veya şifre hatalı.';
      errEl.style.display = 'block';
    }
  };

  window.doLogout = () => signOut(auth);

  window.showTab = (tab, btn) => {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    btn.classList.add('active');
  };

  onAuthStateChanged(auth, async user => {
    if (user && user.email === ALLOWED_EMAIL) {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      await loadMessages();
    } else {
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
    }
  });

  async function loadMessages() {
    const listEl = document.getElementById('messagesList');
    try {
      const snap = await getDocs(query(collection(db, 'contactMessages'), orderBy('createdAt', 'desc')));
      const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      document.getElementById('statMessages').textContent = msgs.length;
      document.getElementById('statUnread').textContent = msgs.length;

      if (msgs.length === 0) {
        listEl.innerHTML = '<div class="empty-state">Henüz mesaj yok.</div>';
        return;
      }

      listEl.innerHTML = msgs.map(m => {
        const date = m.createdAt ? new Date(m.createdAt).toLocaleString('tr-TR') : '';
        const subject = encodeURIComponent(`Re: ${m.subject || 'Tennisytics'}`);
        const body = encodeURIComponent(`\n\n---\nMesajınız:\n${m.message}`);
        return `
          <div class="msg-card">
            <div class="msg-header">
              <span class="msg-name">${esc(m.name || '')} &lt;${esc(m.email || '')}&gt;</span>
              <span class="msg-date">${date}</span>
            </div>
            <div class="msg-subject">${esc(m.subject || '')}</div>
            <div class="msg-body">${esc(m.message || '')}</div>
            <a class="reply-btn" href="mailto:${esc(m.email || '')}?subject=${subject}&body=${body}">Yanıtla</a>
          </div>`;
      }).join('');
    } catch (e) {
      listEl.innerHTML = `<div class="empty-state">Mesajlar yüklenemedi: ${e.message}</div>`;
    }
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Enter key on password
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('passInput')?.addEventListener('keydown', e => {
      if (e.key === 'Enter') window.doLogin();
    });
  });
</script>
</body>
</html>
